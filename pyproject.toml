[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "log-wise"
version = "3.0.0"
description = "Drop-in coloured logger with daily file rotation for any Python project."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Klaus Moser" }]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/tg4nd4lf/log-wise"
